name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run test suite
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Syntax check (py_compile)
        run: |
          python -m py_compile server.py monitor-cli.py

      - name: Shell syntax check
        run: bash -n deploy.sh

  frontend:
    # The dashboard is a single 1700-line HTML file with ~1150 lines of inline
    # JS. A syntax error there ships silently (the page loads, then every
    # handler throws). node --check catches it without a browser. ubuntu-latest
    # ships Node, so no setup step is needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check (inline dashboard JS + service worker)
        run: |
          # Extract the single inline <script> block and check it.
          awk '/<script>/{f=1;next} /<\/script>/{f=0} f' dashboard.html > /tmp/dashboard.js
          test -s /tmp/dashboard.js || { echo "no inline JS extracted"; exit 1; }
          node --check /tmp/dashboard.js
          node --check sw.js
          echo "dashboard.html inline JS: OK"
          echo "sw.js: OK"
